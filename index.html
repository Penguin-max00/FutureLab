<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1220" />
    <script>
      // Apply the saved palette before the first paint to avoid a theme flash.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('futurelab.theme.v1') === 'light'
            ? 'light'
            : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute(
          'content',
          document.documentElement.dataset.theme === 'light'
            ? '#F6F2EC'
            : '#0B1220',
        );
    </script>
    <meta
      name="description"
      content="Explore the financial trade-offs of two college paths with a transparent, local-first simulator."
    />
    <title>FutureLab — Explore your next chapter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
